contest = "abc413"
problem = "e"
url = "https://atcoder.jp/contests/abc413/tasks/abc413_e"
status = "supported"
coverage = "restricted"
description = "Tケースの指数Nと長さ2^Nの順列。総長の残量を予約し、各ケースを奇数係数のアフィン順列として平坦配列へ保存する。"
constraints = [
    "1 ≤ T ≤ 100000、各1 ≤ N ≤ 18。Pは1..2^Nの順列。すべて整数。",
    "ファイル全体でsum(2^N) ≤ 300000。ケース内の問題文の添字0始まりをDSLでは1始まりに対応させる。",
]
limitations = [
    "通常T≤64。各ケースの係数a=2*OddIndex-1は奇数、b=Shiftを0..2^N-1から選ぶ。2の累乗との互いに素性で全単射を保証するが、一般の非アフィン順列は生成しない。",
    "T=100000と総長300000の同時境界も、N=1/2を固定配分する別プロファイルで確認する。通常Tの範囲拡大とは数えない。",
]
missing_features = ["可変区画ごとの独立U1。総長の予約と累乗表は現行の累積配列・比較・反復で構成可能。"]
