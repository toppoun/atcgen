contest = "abc298"
problem = "c"
url = "https://atcoder.jp/contests/abc298/tasks/abc298_c"
status = "supported"
coverage = "restricted"
description = "N、Q、箱・カードの3種類のクエリ。最初に挿入し、問い合わせは挿入履歴の箱または値を参照する。"
constraints = [
    "1 ≤ N,Q ≤ 200000。種別1は1 ≤ i ≤ 200000、1 ≤ j ≤ N。すべて整数。",
    "種別2は1..Nの非空箱、種別3は1..200000の既存カード番号。解答に出す整数の総数は200000以下。",
    "種別2では同番号のカードも多重度を数え、種別3では同じ箱を1回だけ数える。",
]
limitations = [
    "通常Q≤256。各回答長は挿入数以下なので総解答出力量≤Q^2≤65536を保証。Nは公式範囲全体。",
    "Q=900、500回の同じ箱への挿入と400回の種別2で解答総数200000を固定検証する。Q=200000は6Q+1セルの保存方式では容量未達。",
    "チェッカーは箱ごとの多重集合と値ごとの所属箱集合を持ち、出力量を正確に数える。最初のクエリ挿入もチェッカーの追加制約にはしない。",
]
missing_features = ["長い操作列での省メモリ化と、正確な解答出力量予算の生成時の管理。"]
