contest = "abc302"
problem = "f"
url = "https://atcoder.jp/contests/abc302/tasks/abc302_f"
status = "supported"
coverage = "restricted"
description = "N Mの後、各集合の長さA_iと要素列を各1行。共通U1順列Pの先頭A_i要素をrowで出力する。"
constraints = [
    "1 ≤ N ≤ 200000、2 ≤ M ≤ 200000、1 ≤ sum(A_i) ≤ 500000。すべて整数。",
    "集合内は相異なる1..Mの要素。集合間の重複は許される。公式制約欄にA_iの正の下限はない。",
]
limitations = [
    "通常N,M ≤ 128、1 ≤ A_i ≤ Mなので要素数総和は16384以下。空集合は通常生成しないがチェッカーは受理し、固定境界でも確認する。",
    "全集合が共通順列の接頭辞で、集合族は包含関係に限定される。独立集合・一般的な交差を生成できたとはしない。",
    "N=M=200000と総和500000は長さを固定した別プロファイルで検証し、通常生成の範囲拡大とは数えない。",
]
missing_features = ["可変区画ごとの独立U1と、集合ごとの候補全走査を避ける抽選。"]
